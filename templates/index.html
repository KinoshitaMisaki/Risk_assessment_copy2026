{% extends "base.html" %}

{% block content %}
<div class="py-16">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">CREATE-SIMPLE Web</h1>
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8">
        <form action="{{ url_for('process_csv') }}" method="post" enctype="multipart/form-data">
            <div class="mb-6">
                <label for="file" class="block mb-2 text-sm font-medium text-gray-900">調査票CSVファイルを選択</label>
                <input type="file" name="file" id="file" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
            </div>
            <button type="submit" class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                リスク評価を実行
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('download_template') }}" class="text-sm text-blue-600 hover:underline">テンプレートCSVをダウンロード</a>
        </div>
    </div>
</div>
{% endblock %}
