{% extends "base.html" %}

{% block content %}
<div class="py-16">
    <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">リスク評価結果</h1>
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-8">
        <div class="mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">評価サマリー</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-800 text-white">
                        <tr>
                            {% for column in columns %}
                                <th class="py-2 px-4 text-left">{{ column }}</th>
                            {% endfor %}
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in data %}
                            <tr class="border-b">
                                {% for column in columns %}
                                    <td class="py-2 px-4">{{ row[column] }}</td>
                                {% endfor %}
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <div class="text-center">
            <a href="#" class="inline-block text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:outline-none focus:ring-green-300 font-medium rounded-lg text-sm px-5 py-2.5">
                結果をダウンロード
            </a>
        </div>
    </div>
</div>
{% endblock %}
