<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一括評価結果 - CREATE-SIMPLE Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.css" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
        .table-fixed-layout { table-layout: fixed; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <header class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i class="lucide lucide-beaker"></i>
                <h1 class="text-xl font-bold">CREATE-SIMPLE Web</h1>
            </div>
            <a href="/" class="text-sm font-semibold hover:underline flex items-center gap-1">
                <i class="lucide lucide-arrow-left-from-line w-4 h-4"></i>
                個別評価に戻る
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <section class="bg-white rounded-xl shadow-lg border border-slate-200">
            <div class="bg-slate-100 px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="lucide lucide-list-checks text-blue-600"></i>
                    <h2 class="font-bold text-slate-700">一括評価結果 ({{ results|length }}件)</h2>
                </div>
                <form action="/download_results" method="POST">
                    <input type="hidden" name="results_json" value="{{ results_json }}">
                    <button type="submit" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-md shadow transition flex items-center gap-1">
                        <i class="lucide lucide-download-cloud w-4 h-4"></i>
                        結果をCSVダウンロード
                    </button>
                </form>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left table-fixed-layout">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-3 w-1/12 font-semibold">CAS RN</th>
                            <th class="p-3 w-2/12 font-semibold">物質名</th>
                            <th class="p-3 w-2/12 font-semibold">作業名</th>
                            <th class="p-3 w-2/12 font-semibold">推定ばく露濃度 (ppm)</th>
                            <th class="p-3 w-1/12 font-semibold">リスク比 (RCR)</th>
                            <th class="p-3 w-1/12 font-semibold text-center">リスクレベル</th>
                            <th class="p-3 w-3/12 font-semibold">判定</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in results %}
                        <tr class="border-b border-slate-100 hover:bg-slate-50/50">
                            <td class="p-3 font-mono text-xs">{{ row.chem.cas }}</td>
                            <td class="p-3 font-semibold truncate">{{ row.chem.name }}</td>
                            <td class="p-3 text-slate-600 truncate">{{ row.title }}</td>
                            <td class="p-3 font-mono">{{ row.conc }}</td>
                            <td class="p-3 font-mono">{{ row.rcr }}</td>
                            <td class="p-3 text-center">
                                <span class="px-3 py-1 rounded-full font-bold text-xs {{ row.level.color }} border border-current">
                                    {{ row.level.val }}
                                </span>
                            </td>
                            <td class="p-3 text-slate-600">{{ row.level.msg }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
