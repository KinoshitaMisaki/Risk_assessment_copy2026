<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-g">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学物質リスクアセスメント結果</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white p-6 rounded-lg shadow-lg">
            <h1 class="text-2xl font-bold mb-4">リスクアセスメント結果</h1>

            <div class="mb-6">
                <a href="{{ url_for('download_file', filename=filename) }}" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-300">
                    CSVをダウンロード
                </a>
            </div>

            <div class="overflow-x-auto">
                {{ result_table | safe }}
            </div>
        </div>
    </div>
</body>
</html>
